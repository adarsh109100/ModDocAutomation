<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JIRA Mod Doc Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-dark gradient">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">JIRA Mod Doc Generator</span>
      </div>
    </nav>

    <div class="container mt-4">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#generate" type="button" role="tab">Generate Mod Doc</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab">JIRA API Configuration</button>
        </li>
      </ul>

      <div class="tab-content pt-3">
        <div class="tab-pane fade show active" id="generate" role="tabpanel">
          <div class="card shadow-sm">
            <div class="card-body">
              <form method="post" action="{{ url_for('generate_and_download') }}">
                <div class="mb-3">
                  <label class="form-label">JQL Query</label>
                  <input type="text" name="jira_query" class="form-control" placeholder="project = OLK AND fixVersion = 64766 ORDER BY created ASC" required>
                </div>

                <!-- New metadata fields to populate template placeholders -->
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Onelink Version</label>
                    <input type="text" name="version" class="form-control" placeholder="e.g., 1.2.3">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Release</label>
                    <input type="text" name="release" class="form-control" placeholder="e.g., 2026.02">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Revision</label>
                    <input type="text" name="revision" class="form-control" placeholder="e.g., R12">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Build</label>
                    <input type="text" name="build" class="form-control" placeholder="e.g., 20260207.1">
                  </div>
                </div>

                <div class="mt-3">
                  <button class="btn btn-success" type="submit">Create & Download Mod Doc</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="config" role="tabpanel">
          <div class="card shadow-sm">
            <div class="card-body">
              <!-- Save config form -->
              <form method="post" action="{{ url_for('save_config') }}">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">JIRA Base URL</label>
                    <input type="text" name="JIRA_BASE_URL" class="form-control" placeholder="https://yourdomain.atlassian.net" value="{{ config.JIRA_BASE_URL or '' }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">JIRA Email</label>
                    <input type="email" name="JIRA_EMAIL" class="form-control" placeholder="you@company.com" value="{{ config.JIRA_EMAIL or '' }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">JIRA API Token</label>
                    <input type="password" name="JIRA_API_TOKEN" class="form-control" value="{{ config.JIRA_API_TOKEN or '' }}" required>
                  </div>
                </div>
                <div class="mt-3">
                  <button class="btn btn-primary" type="submit">Save Configuration</button>
                </div>
              </form>
              <!-- Separate test connection form (not nested) -->
              <form method="post" action="{{ url_for('test_connection') }}" class="mt-2">
                <button class="btn btn-outline-secondary" type="submit">Test Jira Connection</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
